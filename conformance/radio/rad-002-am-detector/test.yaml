id: RAD-002
title: Diode AM detector
tags: [common, "dialect:ngspice", "dialect:xyce"]
kind: cross-tool
status: verified
verified_on: [ngspice]
pending: [tool_agreement]
netlists:
  ngspice: netlist.ngspice.cir
  xyce: netlist.xyce.cir
notes: |
  Only the source card B1 differs. A portable AM source is an open item
  (see docs/design.md, section 12). The Xyce variant is untested; Xyce is
  believed to require braces around the expression.
analysis_window: 2m to 5m   # skip start-up and the Cc/Ra settling
checks:
  - name: fundamental_dominates_carrier
    quantity: amplitude of v(aud) at 1 kHz / amplitude at 1 MHz
    expected: ">= 10"
  - name: fundamental_present
    quantity: amplitude of v(aud) at 1 kHz
    expected: "> 0.5 mV"    # regression bound from the ngspice 42 run (1.20 mV); not independent
  - name: low_distortion
    quantity: amplitude at 2 kHz / amplitude at 1 kHz
    expected: "<= 0.45"     # regression bound from the ngspice 42 run (0.32); not independent
  - name: tool_agreement
    quantity: 1 kHz amplitude, ngspice vs Xyce
    tolerance: 5%           # provisional
refs: |
  Output low-pass Rl*Cf = 100 us attenuates 1 kHz by about 0.85 and the
  1 MHz residue by a large factor. The first draft assumed the diode was
  square-law at a 0.1 V carrier, which would give a second harmonic of
  m/4 = 12.5% for m = 0.5. The ngspice run gave 32%: with n*Vt of about
  27 mV, a 0.1 V peak carrier is well outside the square-law region, so
  that estimate was wrong. The numeric bounds are now regression bounds
  set from the ngspice 42 result and are not independent of it. They
  should be revisited once Xyce results exist.
results:
  - tool: ngspice 42 (Ubuntu package)
    date: 2026-11-24
    netlist: netlist.ngspice.cir
    window: 2 ms to 5 ms, 250k points, mean removed, direct DFT
    amplitude_1kHz: "1.203 mV"
    amplitude_2kHz: "0.379 mV"
    amplitude_1MHz: "0.103 mV"
    ratio_1kHz_to_1MHz: 11.7
    ratio_2kHz_to_1kHz: 0.315
    outcome: pass (against the revised bounds above)
    note: With the original bound (<= 0.25) this test failed on the second harmonic. Bound was changed after the run; see refs.
